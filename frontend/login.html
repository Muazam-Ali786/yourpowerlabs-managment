<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>YourPower Labs — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0c0f; --surface: #12151b; --border: #1e2330;
      --text: #e6eaf2; --muted: #6b7491; --accent: #cdfe2d;
      --red: #ef4444; --green: #22c55e;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; }
    .logo-wrap { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 28px; }
    .logo-wrap img { width: 48px; height: 48px; border-radius: 50%; }
    .logo-wrap span { font-size: 22px; font-weight: 700; color: var(--accent); }
    h2 { text-align: center; font-size: 20px; margin-bottom: 6px; }
    .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .error { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: var(--red); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 11px 14px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; background: var(--accent); color: #0a0c0f; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: opacity .15s; }
    button:hover { opacity: .9; }
    .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/logo.png" alt="YPL"/>
      <span>YourPower Labs</span>
    </div>
    <h2>Welcome Back</h2>
    <p class="sub">Sign in to your account</p>
    <div class="error" id="errBox"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"/>
    </div>
    <button id="loginBtn" onclick="doLogin()">Sign In</button>
    <div class="footer">YourPower Labs &copy; 2025</div>
  </div>
  <script>
    const API = 'http://localhost:3000/api';
    document.getElementById('password').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
    async function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('errBox');
      err.style.display = 'none';
      if (!u || !p) { err.textContent='Enter username and password.'; err.style.display='block'; return; }
      document.getElementById('loginBtn').textContent = 'Signing in...';
      try {
        const res = await fetch(`${API}/auth/login`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:u, password:p})
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.detail || 'Login failed.'; err.style.display='block'; return; }
        localStorage.setItem('ypl_token', data.token);
        localStorage.setItem('ypl_user', JSON.stringify(data.user));
        window.location.href = 'index.html';
      } catch {
        err.textContent = 'Cannot connect to server. Is the backend running?';
        err.style.display = 'block';
      } finally {
        document.getElementById('loginBtn').textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
